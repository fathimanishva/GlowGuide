<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Questionnaire Result - GlowGuide</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container py-5">

    <div class="card shadow p-5 text-center">

        <h2 class="fw-bold mb-4">
            🌸 Questionnaire Result
        </h2>

        <p class="text-muted">
            Based on your answers, your estimated skin type is:
        </p>

        <h1 class="text-primary text-capitalize mb-4">
            {{ skin_type }} Skin
        </h1>

        <p class="text-muted">
            This is a basic questionnaire-based estimate and is
            not a medical diagnosis.
        </p>

        <hr class="my-4">

        <h5 class="fw-bold mb-3">
            Your Scores
        </h5>

        {% for type, score in scores.items() %}

        <div class="d-flex justify-content-between mb-2">

            <span class="text-capitalize">
                {{ type }}
            </span>

            <strong>
                {{ score }}
            </strong>

        </div>

        {% endfor %}

        <div class="mt-4">

            <a href="{{ url_for('dashboard') }}"
               class="btn btn-primary px-5">

                Back to Dashboard

            </a>

        </div>

    </div>

</div>

</body>

</html>
