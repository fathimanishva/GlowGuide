<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Skin Questionnaire - GlowGuide</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container py-5">

    <div class="card shadow p-5">

        <h2 class="text-center fw-bold mb-3">
            🌸 Skin Questionnaire
        </h2>

        <p class="text-center text-muted mb-4">
            Answer these questions to get a basic estimate of your skin type.
        </p>

        <form method="POST">

            <!-- Question 1 -->

            <div class="mb-4">

                <label class="form-label fw-bold">
                    1. How does your skin usually feel after washing?
                </label>

                <select name="q1" class="form-select" required>

                    <option value="">
                        Select an answer
                    </option>

                    <option value="dry">
                        Tight or dry
                    </option>

                    <option value="oily">
                        Oily or greasy
                    </option>

                    <option value="normal">
                        Comfortable
                    </option>

                    <option value="combination">
                        Some areas feel dry while others feel oily
                    </option>

                </select>

            </div>


            <!-- Question 2 -->

            <div class="mb-4">

                <label class="form-label fw-bold">
                    2. How does your skin look during the day?
                </label>

                <select name="q2" class="form-select" required>

                    <option value="">
                        Select an answer
                    </option>

                    <option value="dry">
                        Often dry or flaky
                    </option>

                    <option value="oily">
                        Shiny or oily
                    </option>

                    <option value="normal">
                        Balanced
                    </option>

                    <option value="combination">
                        Oily in some areas and dry in others
                    </option>

                </select>

            </div>


            <!-- Question 3 -->

            <div class="mb-4">

                <label class="form-label fw-bold">
                    3. How often does your skin feel oily?
                </label>

                <select name="q3" class="form-select" required>

                    <option value="">
                        Select an answer
                    </option>

                    <option value="dry">
                        Rarely
                    </option>

                    <option value="oily">
                        Very often
                    </option>

                    <option value="normal">
                        Occasionally
                    </option>

                    <option value="combination">
                        Mostly around the T-zone
                    </option>

                </select>

            </div>


            <!-- Question 4 -->

            <div class="mb-4">

                <label class="form-label fw-bold">
                    4. How does your skin usually feel in dry weather?
                </label>

                <select name="q4" class="form-select" required>

                    <option value="">
                        Select an answer
                    </option>

                    <option value="dry">
                        Very dry or tight
                    </option>

                    <option value="oily">
                        Still oily
                    </option>

                    <option value="normal">
                        Mostly comfortable
                    </option>

                    <option value="combination">
                        Some areas become dry while others remain oily
                    </option>

                </select>

            </div>


            <!-- Question 5 -->

            <div class="mb-4">

                <label class="form-label fw-bold">
                    5. How would you describe your overall skin?
                </label>

                <select name="q5" class="form-select" required>

                    <option value="">
                        Select an answer
                    </option>

                    <option value="dry">
                        Mostly dry
                    </option>

                    <option value="oily">
                        Mostly oily
                    </option>

                    <option value="normal">
                        Balanced and comfortable
                    </option>

                    <option value="combination">
                        Combination of dry and oily areas
                    </option>

                </select>

            </div>


            <div class="text-center mt-4">

                <button type="submit"
                        class="btn btn-primary btn-lg px-5">

                    Check My Skin Type

                </button>

            </div>

        </form>

    </div>

</div>

</body>

</html>
